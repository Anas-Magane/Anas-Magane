<svg width="1600" height="940" viewBox="0 0 1600 940" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Anas Magane cybersecurity ASCII GitHub profile</title>
<desc id="desc">Responsive terminal-style profile card with professional details on the left and a large ASCII portrait on the right.</desc>
<defs>
